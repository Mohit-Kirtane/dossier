services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://ekc:ekc@postgres:5432/ekc
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.6-flash}
    volumes:
      - ./backend/app:/app/app
      - ekc_data:/app/data
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ekc
      POSTGRES_PASSWORD: ekc
      POSTGRES_DB: ekc
    ports:
      - "5432:5432"
    volumes:
      - ekc_postgres:/var/lib/postgresql/data

volumes:
  ekc_data:
  ekc_postgres:
