services:
  - type: web
    name: dossier
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_KEY_FALLBACK
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: DATABASE_URL
        sync: false
      - key: FAISS_INDEX_DIR
        value: /app/data/faiss_index
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: POLICY_FAISS_INDEX_DIR
        value: /app/data/policy_faiss_index
      - key: POLICY_UPLOAD_DIR
        value: /app/data/policy_uploads
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
    disk:
      name: ekc-data
      mountPath: /app/data
      sizeGB: 1
